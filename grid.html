
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Grid Assignment</title>
  <style>
    .container {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: 55px 80px 80px 55px;
      gap: 4px;
      background-color: goldenrod;
      padding: 4px;
      width: 750px;
      max-width: calc(100% - 8px);
      box-sizing: border-box;
    }

    .box1 {
      background-color: tomato;
      grid-column: 1 / 3;
    }

    .box2 {
      background-color: gold;
      grid-column: 3 / 5;
    }

    .box3 {
      background-color: mediumseagreen;
      grid-row: 2 / 4;
    }

    .box4 {
      background-color: hotpink;
      grid-column: 2 / 4;
    }

    .box5 {
      background-color: royalblue;
      grid-column: 4;
      grid-row: 2 / 4;
    }

    .box6 {
      background-color: orchid;
    }

    .box7 {
      background-color: turquoise;
    }

    .box8 {
      background-color: coral;
      grid-column: 1 / 4;
    }

    .box9 {
      background-color: slateblue;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
    <div class="box4"></div>
    <div class="box5"></div>
    <div class="box6"></div>
    <div class="box7"></div>
    <div class="box8"></div>
    <div class="box9"></div>
  </div>
</body>
</html>
